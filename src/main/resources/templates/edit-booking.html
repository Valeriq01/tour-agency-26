<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Booking</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="/css/edit-booking.css">

</head>

<body>

<header class="header">

  <div class="logo">Travel Agency</div>

  <nav class="nav">

    <a href="/home">Home</a>
    <a href="/destinations">Destinations</a>
    <a href="/my-bookings">My Bookings</a>

    <a th:if="${user.role.name() == 'ADMIN'}"
       th:href="@{/admin/users}">
      Manage Users
    </a>

  </nav>

  <div class="profile-menu">

    <a th:href="@{/profile}">
      Profile
    </a>

    <form th:action="@{/logout}"
          method="post"
          class="logout-form">

      <button type="submit"
              class="logout-btn">
        Logout
      </button>

    </form>

  </div>

</header>

<section class="edit-hero">

  <h1>Edit Booking</h1>

  <p>Update your reservation</p>

</section>

<main class="edit-container">

  <form class="edit-card"
        th:action="@{/booking/edit/{id}(id=${bookingEditDto.id})}"
        th:object="${bookingEditDto}"
        method="post">

    <input type="hidden" th:field="*{id}">

    <label>Persons</label>

    <input type="number"
           th:field="*{persons}">

    <div class="error"
         th:if="${#fields.hasErrors('persons')}"
         th:errors="*{persons}">
    </div>

    <label>Start Date</label>

    <input type="date"
           th:field="*{startDate}">

    <div class="error"
         th:if="${#fields.hasErrors('startDateValid')}"
         th:errors="*{startDateValid}">
    </div>

    <label>End Date</label>

    <input type="date"
           th:field="*{endDate}">

    <div class="error"
         th:if="${#fields.hasErrors('endDateValid')}"
         th:errors="*{endDateValid}">
    </div>

    <label>Notes</label>

    <textarea th:field="*{notes}"></textarea>

    <div class="error"
         th:if="${#fields.hasErrors('notes')}"
         th:errors="*{notes}">
    </div>

    <button type="submit">
      Update Booking
    </button>

  </form>

</main>

</body>

</html>
