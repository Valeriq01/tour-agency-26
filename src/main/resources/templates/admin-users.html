<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/admin-users.css">

    <title>Manage Users</title>

</head>

<body>

<header class="header">

    <div class="logo">Travel Agency</div>

    <nav class="nav">
        <a href="/home">Home</a>
        <a href="/destinations">Destinations</a>
        <a href="/my-bookings">My Bookings</a>
        <a th:href="@{/favorites}">My Favorites</a>
        <a href="/admin/users" class="active">Manage Users</a>
    </nav>

    <div class="profile-menu">

        <a th:href="@{/profile}">
            Profile
        </a>

        <form th:action="@{/logout}"
              method="post"
              class="logout-form">

            <button class="logout-btn"
                    type="submit">
                Logout
            </button>

        </form>

    </div>

</header>

<main>

    <section class="hero">

        <div class="hero-content">

            <h1>Manage Users</h1>

            <p>Promote or demote users.</p>

        </div>

    </section>

    <div th:if="${error}" class="alert-warning">
        <span th:text="${error}"></span>
    </div>

    <section class="users-section">

        <div class="users-grid">

            <div class="user-card"
                 th:each="user : ${users}">

                <h3 th:text="${user.username}"></h3>

                <p>
                    <strong>Email:</strong>
                    <span th:text="${user.email}"></span>
                </p>

                <p>
                    <strong>Role:</strong>

                    <span class="role"
                          th:text="${user.role}">
                    </span>
                </p>

                <div class="actions">

                    <form th:if="${user.role.name() == 'USER'}"
                          th:action="@{/admin/users/{id}/role(id=${user.id})}"
                          method="post">

                        <input type="hidden"
                               name="role"
                               value="ADMIN"/>

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button class="admin-btn"
                                type="submit">

                            Make Admin

                        </button>

                    </form>

                    <form th:if="${user.role.name() == 'ADMIN'}"
                          th:action="@{/admin/users/{id}/role(id=${user.id})}"
                          method="post">

                        <input type="hidden"
                               name="role"
                               value="USER"/>

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button class="user-btn"
                                type="submit">

                            Make User

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>

</main>

<footer class="footer">
    © 2026 Travel Explorer. All rights reserved.
</footer>

</body>

</html>
