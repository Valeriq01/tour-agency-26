<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/home.css">

    <title>Travel Agency</title>
</head>
<body>

<header class="header">
    <div class="logo">
        Travel Agency
    </div>

    <nav class="nav">
        <a href="/home" class="active">Home</a>
        <a href="/destinations">Destinations</a>
        <a href="/my-bookings">My Bookings</a>
    </nav>

    <div class="profile-menu">
        <a th:href="@{/profile/{id}(id=${user.id})}">Profile</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</header>

<main>

    <section class="hero">
        <div class="hero-content">
            <h1>Discover Your Next Adventure</h1>
            <p>Explore amazing destinations around the world.</p>
        </div>
    </section>

    <section class="destinations-section">

        <h2>Popular Destinations</h2>
        <div class="destinations-grid">

            <div class="destination-card"
                 th:each="destination : ${popularDestinations}">

                <div class="image-container">
                    <img th:src="${destination.imageUrl}" alt="destination">

                    <div class="trip-duration">
                        <span th:text="${destination.days + ' Days'}"></span>
                    </div>
                </div>

                <div class="card-content">
                    <h3 th:text="${destination.name}"></h3>
                    <p th:text="${destination.country}"></p>

                    <span class="price"
                          th:text="${'€' + destination.price}">
            </span>

                    <a th:href="@{/destinations/{id}(id=${destination.id})}"
                       class="details-btn">
                        View Details
                    </a>
                </div>

            </div>

        </div>
    </section>

</main>

<footer class="footer">
    © 2026 Travel Explorer. All rights reserved.
</footer>

</body>
</html>
